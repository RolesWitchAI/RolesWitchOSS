			shellPath = /bin/sh;
			shellScript = "if [ \"install\" != \"$ACTION\" ]; then\n  exit 0\nfi\ncd \"$BUILT_PRODUCTS_DIR\" || exit 1\nfor fw in *.framework; do\n  name=\"${fw%.framework}\"\n  bin=\"$fw/$name\"\n  if [ ! -f \"$bin\" ]; then\n    continue\n  fi\n  uuids=\"$(xcrun dwarfdump --uuid \"$bin\" 2>/dev/null)\"\n  if [ -z \"$uuids\" ]; then\n    continue\n  fi\n  if [ -d \"$name.framework.dSYM\" ]; then\n    continue\n  fi\n  out=\"$(xcrun dsymutil \"$bin\" -o \"$name.framework.dSYM\" 2>&1)\"\n  if [ ! -f \"$name.framework.dSYM/Contents/Resources/DWARF/$name\" ]; then\n    echo \"error: $fw carries a UUID but ships no dSYM, and stub generation failed:\"\n    echo \"$uuids\"\n    echo \"$out\"\n    exit 1\n  fi\n  echo \"note: generated $name.framework.dSYM from a prebuilt binary without debug info (UUID-only, satisfies App Store validation)\"\n  echo \"$uuids\"\ndone\n";
		};
